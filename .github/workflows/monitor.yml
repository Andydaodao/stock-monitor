name: 启动股票监控 Session

on:
  workflow_dispatch:
    inputs:
      stocks:
        description: "监控股票，逗号分隔，例如 300398.SZ,300502.SZ"
        required: true
        type: string
      until:
        description: "北京时间结束时刻，例如 11:30 或 15:00"
        required: true
        type: string
      interval_minutes:
        description: "采样间隔（至少 5 分钟）"
        required: false
        default: "5"
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stock-monitor-session
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 配置数据提交身份
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: 运行云端监控 Session
        env:
          SESSION_STOCKS: ${{ inputs.stocks }}
          SESSION_UNTIL: ${{ inputs.until }}
          SESSION_INTERVAL_MINUTES: ${{ inputs.interval_minutes }}
        run: python src/session.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - name: 发布最终页面快照
        id: deployment
        uses: actions/deploy-pages@v5
